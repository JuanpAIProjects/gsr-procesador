# Procesador automático de GSR360: cada hora de 6:20 a 22:20 (hora del centro de México) abre la app, baja lo nuevo de OneDrive y lo recalcula.
# Gratis en un repositorio público (los minutos no se cobran). No guarda nada entre corridas y no imprime datos de la empresa.
# Si una corrida falla dos veces seguidas, GitHub te manda un correo.
# v222: ya no hace un «commit» el día 1 para que GitHub no pause el horario (eso falló el 1 de noviembre): ahora le pide a GitHub
# que mantenga activo el horario, sin escribir nada en el repositorio, y si eso falla no marca la corrida como fallida.
name: Procesar GSR360
on:
  schedule:
    - cron: '20 12-23 * * *'   # 6:20 a 17:20 en Ciudad de México (UTC-6)
    - cron: '20 0-4 * * *'     # 18:20 a 22:20
  workflow_dispatch: {}         # botón «Run workflow» para correrlo a mano
concurrency: { group: procesar, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # v247: antes 15; una versión nueva de la app suma la revisión de pestañas y la corrida se cancelaba sin correo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund --silent
      - name: Procesar
        env:
          GSR_URL: ${{ secrets.GSR_URL }}
          GSR_USUARIO: ${{ secrets.GSR_USUARIO }}
          GSR_CLAVE: ${{ secrets.GSR_CLAVE }}
          CHROME_PATH: /usr/bin/google-chrome
          TZ: America/Mexico_City
        run: node procesar.js
      - name: Mantener activo el horario
        if: github.event_name == 'schedule' && always()
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if [ "$(TZ=America/Mexico_City date +%H)" = "06" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/procesar.yml/enable" && echo "Horario activo"
          fi
